name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: Check tag matches version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version v$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check tag is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi
      - run: uv sync --locked
      - run: make check
      - run: uv build
      - name: Smoke-install the wheel
        run: |
          set -euo pipefail
          wheel="$PWD/dist/wenchang-$VERSION-py3-none-any.whl"
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "wenchang[mcp,testing] @ file://$wheel"
          # Run outside the checkout so src/ is not importable.
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" - "$VERSION" <<'EOF'
          import importlib
          import importlib.metadata
          import sys

          import wenchang

          expected = sys.argv[1]
          assert wenchang.__version__ == expected, wenchang.__version__
          assert importlib.metadata.version("wenchang") == expected
          for name in ("core", "tools", "prompts", "storage.memory", "testing", "mcp"):
              importlib.import_module(f"wenchang.{name}")
          EOF
      - name: Extract release notes
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            found && (/^## / || (/^\[/ && /\]: /)) { exit }
            found { print }
            index($0, "## [" v "] - ") == 1 { found = 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no entries for $VERSION"
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
