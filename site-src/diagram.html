<figure class="pipe">
<ol class="nodes" aria-label="Request path from agent to bucket">
<li class="node"><span class="id">1</span><b>Agent</b><span class="d">Your model and host, holding the memory prompt</span></li>
<li class="wire" aria-hidden="true"><span>MCP: seven tools</span></li>
<li class="node"><span class="id">2</span><b>MCP tools</b><code>wenchang.mcp, wenchang.tools</code><span class="d">Resolve identity on every call. Refuse system/ and role-gated writes.</span></li>
<li class="wire" aria-hidden="true"><span>TransportClient</span></li>
<li class="node"><span class="id">3</span><b>MemoryStore</b><span class="d">Versioned writes, size limits, metadata merge, capped index</span></li>
<li class="wire" aria-hidden="true"><span>Storage protocol</span></li>
<li class="node"><span class="id">4</span><b>GcsStorage</b><span class="d">One GCS bucket: markdown body as the object, metadata beside it</span></li>
</ol>
<div class="pipe-down" aria-hidden="true"></div>
<div class="bucket" role="group" aria-label="The bucket has one directory per scope">
<p class="bar"><span>gcs bucket</span><span>{scope}/{entity_id}/{area}/{name}.md</span></p>
<ul>
<li><span class="t"><span aria-hidden="true">&boxvr;&boxh; </span><b>user/</b>u-ada/&hellip;</span><span class="n">Private to one person</span></li>
<li><span class="t"><span aria-hidden="true">&boxvr;&boxh; </span><b>project/</b>p-checkout/&hellip;</span><span class="n">Shared by a project</span></li>
<li><span class="t"><span aria-hidden="true">&boxvr;&boxh; </span><b>organization/</b>o-acme/&hellip;</span><span class="n">Written by admins</span></li>
<li><span class="t"><span aria-hidden="true">&boxur;&boxh; </span><b class="ro">&lt;scope&gt;/&hellip;/system/</b></span><span class="n">In every scope: curated, read-only</span></li>
</ul>
</div>
<figcaption>Scopes are yours to define; <code>user</code>, <code>project</code>, and <code>organization</code> are the reference adopter's. Every scope also has a read-only <code>system/</code> area.</figcaption>
</figure>
