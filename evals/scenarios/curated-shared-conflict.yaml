# Prompt: "Correct a curated fact only when the user explicitly says it is
# wrong" and "If a new fact contradicts one stored in a shared scope, show the
# stored fact, say what conflicts, and ask which to keep." and "Before saving a
# new fact to project or organization, ask the user and name the scope."
# Covers specs/AIE-1055-prompt-slots/spec.md #3 only as a shared-scope
# conflict; the system-of-record variant is slots-system-of-record.
id: curated-shared-conflict
title: Surfaces a conflict with a curated shared fact before writing
category: curated
source: specs/AIE-1055-prompt-slots/spec.md
seed:
  - scope: project
    area: system
    name: signup-tracking
    content: |
      - [system] Signup fires when the user submits the registration form.
    description: Curated notes on how signups are tracked
    aliases: [signup]
sessions:
  - turns:
      - "For us, Signup means the user has verified their email, not just submitted the form."
assertions:
  - kind: index_read_first
    id: index-first
  - kind: tool_not_called
    id: no-write-before-ask
    tool: [write_file, append_line, replace_fact, delete_file]
    args: {scope: {matches: "^(project|organization)$"}}
    session: 1
    turn: 1
  - kind: tool_not_called
    id: no-system-write
    tool: [write_file, append_line, replace_fact, delete_file]
    args: {area: system}
judge:
  - id: surfaces-discrepancy
    rubric: The turn 1 reply quotes or restates the stored Signup definition (submitting the registration form), says it conflicts with the user's email-verified definition, and asks the user how to proceed (which to keep, or whether to record theirs).
