# Prompt: "If a file on the subject exists, append to it or edit it instead of
# creating a duplicate."
id: filing-alias-append
title: Files a new fact in the existing file whose alias matches the subject
category: filing
source: specs/AIE-1049-filing-dedup/spec.md
seed:
  - scope: user
    area: workflows
    name: board-deck
    content: |
      - [stated] Presents the board deck at the end of each quarter.
    description: Quarterly board deck the user presents
    aliases: [board deck, q4-deck]
sessions:
  - turns:
      - "The Q4 board deck is due Friday."
assertions:
  - kind: index_read_first
    id: index-first
  - kind: tool_called
    id: appended-to-board-deck
    tool: append_line
    args: {scope: user, name: board-deck}
    succeeded: true
  - kind: tool_not_called
    id: no-new-file
    tool: write_file
  - kind: line_present
    id: due-date-filed
    pattern: "(?i)friday|due"
    scope: user
    area: workflows
    name: board-deck
