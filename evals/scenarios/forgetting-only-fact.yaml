# Prompt: "When only one removal fits, remove it without asking, and delete the
# file if that was its only fact."
# Covers specs/AIE-1053-forgetting/spec.md E2, for a single-fact file.
id: forgetting-only-fact
title: Deletes a file whose only fact the user asks to forget
category: forgetting
source: specs/AIE-1053-forgetting/spec.md
seed:
  - scope: user
    area: preferences
    name: timezone
    content: |
      - [stated] Works in Pacific time.
    description: User's time zone
    aliases: [timezone]
  - scope: user
    area: preferences
    name: charts
    content: |
      - [stated] Prefers dark backgrounds.
    description: Chart preferences
    aliases: [chart-style]
sessions:
  - turns:
      - "Forget my time zone."
assertions:
  - kind: index_read_first
    id: index-first
  - kind: tool_called
    id: index-called
    tool: get_memory_index
  - kind: file_absent
    id: file-deleted
    scope: user
    area: preferences
    name: timezone
  - kind: tool_called
    id: used-delete
    tool: delete_file
    args: {name: timezone}
    succeeded: true
  - kind: no_content_matching
    id: no-pacific
    pattern: "(?i)pacific"
