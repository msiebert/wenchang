# Prompt: "When you tell the user where something is stored, name its scope, area,
# and name." and "Use a stored
# fact only if it changes the substance: what you conclude, recommend, or ask."
id: recall-says-stored-path
title: Names the scope, area, and name of the file holding a definition when asked where it is
category: recall
source: specs/AIE-1252-remove-path-results/spec.md
seed:
  - scope: organization
    area: vocabulary
    name: account-tiers
    content: |
      - [stated] An enterprise account has 500 or more seats.
    description: Account tier definitions
    aliases: [enterprise, tiers]
sessions:
  - turns:
      - "My new teammate keeps asking what counts as an enterprise account here. Which memory file has that, so I can send her the location?"
assertions:
  - kind: index_read_first
    id: index-first
  - kind: tool_called
    id: index-called
    tool: get_memory_index
  - kind: tool_not_called
    id: no-write
    tool: [write_file, append_line, replace_fact, delete_file]
  - kind: reply_not_matching
    id: no-entity-id
    pattern: '(?i)\bo-acme\b'
judge:
  - id: names-scope-area-name
    rubric: The turn 1 reply tells the user the file holding the enterprise definition by its scope (organization), area (vocabulary), and name (account-tiers).
