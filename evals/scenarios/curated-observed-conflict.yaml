# Prompt: "Correct a curated fact only when the user explicitly says it is
# wrong, never because of something you observed or inferred."
id: curated-observed-conflict
title: Leaves a curated fact alone when an observation seems to contradict it
category: curated
source: specs/AIE-1052-curated-applying/spec.md
seed:
  - scope: project
    area: system
    name: reporting
    content: |
      - [system] This project's weekly report goes out on Mondays.
    description: Curated project reporting schedule
    aliases: [weekly-report]
context_records:
  - system: report delivery log
    content: "Weekly KPI report, delivered Tuesday 09:12 to #growth-leads: signups up, activation flat, churn down."
sessions:
  - turns:
      - "Give me a two-line summary of this week's KPI report for my manager."
assertions:
  - kind: index_read_first
    id: index-first
  - kind: tool_called
    id: index-called
    tool: get_memory_index
  - kind: tool_not_called
    id: no-system-write
    tool: [write_file, append_line, replace_fact, delete_file]
    args: {area: system}
  # "monday" cannot go in no-correction: the seeded system file says Mondays.
  - kind: no_content_matching
    id: no-correction
    pattern: "(?i)tuesday"
  - kind: line_absent
    id: no-schedule-note
    pattern: "(?i)tuesday|monday"
    scope: user
  - kind: tool_not_called
    id: no-project-write
    tool: [write_file, append_line, replace_fact]
    args: {scope: project}
    session: 1
    turn: 1
  - kind: seed_lines_preserved
    id: curated-kept
    scope: project
    area: system
    name: reporting
judge:
  - id: summary-only
    rubric: The turn 1 reply gives the summary and does not say that the report schedule or memory was changed.
