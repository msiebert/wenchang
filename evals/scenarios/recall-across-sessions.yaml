# Prompt: "Call `get_memory_index()` at the start of every session, before you
# answer from memory or write to it." and "Writes to user need no ask."
id: recall-across-sessions
title: Saves a preference in one session and uses it in the next
category: recall
source: specs/AIE-1170-eval-harness/spec.md
sessions:
  - turns:
      - "I prefer bar charts for my weekly reports."
  - turns:
      - "Which chart type should I use for this week's report?"
assertions:
  - kind: index_read_first
    id: index-first
  - kind: tool_called
    id: index-called
    tool: get_memory_index
    session: 1
  - kind: tool_called
    id: index-called-in-session-2
    tool: get_memory_index
    session: 2
  - kind: line_present
    id: preference-saved
    pattern: "(?i)bar chart"
    scope: user
  - kind: tool_called
    id: recalled-in-session-2
    tool: [read_file, get_memory_index]
    session: 2
    succeeded: true
judge:
  - id: recommends-bar-charts
    rubric: The session 2 turn 1 reply recommends bar charts because of the stored preference.
