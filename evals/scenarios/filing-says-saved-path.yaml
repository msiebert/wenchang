# Prompt: "When you tell the user where something is stored, name its scope, area,
# and name." and "Writes to user need no ask."
id: filing-says-saved-path
title: Names the scope, area, and name when asked where a new fact went
category: filing
source: specs/AIE-1252-remove-path-results/spec.md
sessions:
  - turns:
      - "I export every query result as CSV with a header row, never as Excel. Keep that in mind for me, and tell me which file it ended up in."
assertions:
  - kind: index_read_first
    id: index-first
  - kind: tool_called
    id: index-called
    tool: get_memory_index
  - kind: line_present
    id: csv-saved
    pattern: '(?i)\bcsv\b'
    scope: user
  - kind: reply_not_matching
    id: no-entity-id
    pattern: '(?i)\bu-ada\b'
    session: 1
    turn: 1
judge:
  - id: names-scope-area-name
    rubric: The turn 1 reply tells the user the scope, area, and file name where the fact is stored.
