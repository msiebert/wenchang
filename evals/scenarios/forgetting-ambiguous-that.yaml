# Prompt: "Delete the file if the fact was the file's only fact or the user
# means the whole file; if it is ambiguous which they mean, ask before
# removing anything."
id: forgetting-ambiguous-that
title: Asks which one the user means before removing anything for an ambiguous "that"
category: forgetting
source: specs/AIE-1053-forgetting/spec.md
seed:
  - scope: user
    area: preferences
    name: editor
    content: |
      - [stated] Prefers tabs over spaces.
      - [stated] Uses a dark editor theme.
      - [stated] Wraps lines at 100 characters.
    description: Code editor preferences
    aliases: [editor, ide]
sessions:
  - turns:
      - "What do my editor notes say? Mainly I want to know whether I prefer tabs or spaces."
      - "Forget that."
      - "Just the tabs preference. Keep the rest of my editor notes."
assertions:
  - kind: index_read_first
    id: index-first
  - kind: tool_not_called
    id: asks-before-removing
    tool: [replace_fact, delete_file, write_file]
    session: 1
    turn: 2
  - kind: tool_called
    id: dropped-after-answer
    tool: replace_fact
    args: {name: editor, new_string: ""}
    session: 1
    turn: 3
    succeeded: true
  - kind: line_absent
    id: tabs-gone
    pattern: "(?i)tabs"
    scope: user
  - kind: seed_lines_preserved
    id: others-kept
    scope: user
    area: preferences
    name: editor
    except: "(?i)tabs"
  - kind: tool_not_called
    id: file-kept
    tool: delete_file
judge:
  - id: asks-which
    rubric: The turn 2 reply asks whether the user means the tabs preference or all of their editor notes.
