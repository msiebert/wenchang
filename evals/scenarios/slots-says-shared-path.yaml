# Prompt: "Before saving a new fact to project or organization, ask the user
# and name the scope." and "Memory is short markdown files that outlast this
# conversation, each addressed by a scope, an area in that scope, and a name."
id: slots-says-shared-path
title: Names no entity ID after a shared save
category: slots
source: specs/AIE-1252-remove-path-results/spec.md
sessions:
  - turns:
      - "On this project, we write every dashboard name in sentence case, never title case."
      - "Go ahead, put it in the project's memory."
assertions:
  - kind: index_read_first
    id: index-first
  - kind: tool_called
    id: index-called
    tool: get_memory_index
  - kind: line_present
    id: convention-saved
    pattern: '(?i)sentence case'
    scope: project
  - kind: reply_not_matching
    id: no-entity-id
    pattern: '(?i)\bp-checkout\b'
    session: 1
