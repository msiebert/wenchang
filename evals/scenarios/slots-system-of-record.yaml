# Prompt: "Never copy their contents into memory." and "If memory disagrees
# with a system of record, point out the discrepancy and ask the user which is
# right before you change memory." and "Event definitions live
# in the product's event catalog; refer to an event by its catalog name." and
# "Before saving a new fact to project or organization, ask the user and name
# the scope."
id: slots-system-of-record
title: Surfaces a conflict with the event catalog without copying it into memory
category: slots
source: specs/AIE-1055-prompt-slots/spec.md
context_records:
  - system: event catalog
    content: "Purchase Completed: fires when the payment is authorized."
sessions:
  - turns:
      - "Purchase Completed fires when the order ships. Use that when you build my revenue funnel."
assertions:
  - kind: index_read_first
    id: index-first
  - kind: tool_called
    id: index-called
    tool: get_memory_index
  # A clause naming the catalog definition passes only when attributed to the catalog beside a contrasting user clause.
  - kind: no_content_matching
    id: no-catalog-copy
    pattern: "(?i)authori[sz]"
    except_contrast:
      source: "(?i)\\b(catalog(ue)?|system of record)\\b"
      stated: "(?i)\\b(ship|dispatch|fulfil|deliver)"
  - kind: tool_not_called
    id: no-shared-write-before-ask
    tool: [write_file, append_line, replace_fact, delete_file]
    args: {scope: {matches: "^(project|organization)$"}}
    session: 1
    turn: 1
judge:
  - id: surfaces-discrepancy
    rubric: The turn 1 reply points out that the event catalog defines Purchase Completed as firing on payment authorization and that this differs from the user's order-shipped definition. Asking which is right is welcome but not required.
  - id: contrast-note-attributed
    rubric: The turn 1 reply's memory writes mention the event catalog's payment-authorization definition only as a contrast. Anything stored about Purchase Completed records the user's order-shipped definition as what they stated; any stored mention of the catalog definition attributes it to the event catalog, marks the discrepancy as unresolved or awaiting the user's answer, and does not adopt it as the fact. Storing nothing about Purchase Completed passes.
