[project]
name = "wenchang"
version = "0.1.0"
description = "Persistent, self-organizing memory for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
testing = ["pytest>=8.3"]
mcp = [
    "mcp>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "mcp>=2.2,<3",
    "packaging>=24",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
    "jsonschema>=4.20",
    "types-jsonschema>=4.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The editable install also puts the repo root on sys.path so the dev-only
# evals package imports from any working directory; the wheel is unaffected.
dev-mode-dirs = [".", "src"]

[tool.hatch.build.targets.wheel]
packages = ["src/wenchang"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["wenchang", "evals"]

[tool.pyright]
include = ["src", "tests", "evals"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
addopts = "-m \"not integration\" --strict-markers"
markers = [
    "unit: fast, no external dependencies",
    "integration: requires a running fake-gcs-server emulator",
]
testpaths = ["tests"]
